name: Code & Security Check

on:
  workflow_call:
    inputs:
      php:
        type: boolean
        default: true
        description: "Run PHP syntax check"
      secrets:
        type: boolean
        default: true
        description: "Run secret detection"
      js:
        type: boolean
        default: true
        description: "Run JavaScript quality check"

jobs:
  php-lint:
    if: ${{ inputs.php }}
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP Lint
        run: |
          find . -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

  secret-scan:
    if: ${{ inputs.secrets }}
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --redact --verbose --exit-code 1

  js-check:
    if: ${{ inputs.js }}
    name: JavaScript Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for common issues
        run: |
          echo "=== Checking JS syntax ==="
          for f in $(find . -name "*.js" -not -path "*/.git/*"); do
            node --check "$f" && echo "OK: $f" || echo "FAIL: $f"
          done
          echo "=== Checking for exposed emails ==="
          grep -rn "@gmail\.com\|@hotmail\.com\|@yahoo\.com\|@outlook\.com" --include="*.html" . && echo "WARNING: Personal emails found in HTML!" || echo "OK: No personal emails in HTML"
          echo "=== Checking for hardcoded passwords ==="
          grep -rn "DB_PASS\|password\s*=\s*'[^']*'" --include="*.php" --include="*.js" . && echo "WARNING: Hardcoded passwords detected!" || echo "OK: No hardcoded passwords"
